<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>扫码入库</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:22px 16px;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:6px 0 0;
  color:#cbd5e1;
}

main{
  max-width:700px;
  margin:auto;
  padding:15px 15px 80px;
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 10px #0001;
}

h2{
  font-size:18px;
  margin:0 0 14px;
}

label{
  display:block;
  font-size:13px;
  color:#666;
  margin:10px 0 5px;
}

input,textarea,button{
  font:inherit;
}

input,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
}

textarea{
  min-height:70px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#111827;
  color:white;
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  background:#f5f6f8;
  border-radius:10px;
  padding:12px;
  text-align:center;
}

.stat b{
  font-size:22px;
  display:block;
}

.stat span{
  font-size:12px;
  color:#777;
}

.item{
  border-top:1px solid #eee;
  padding:12px 0;
}

.item:first-child{
  border-top:0;
}

.name{
  font-weight:bold;
}

.meta{
  font-size:13px;
  color:#666;
  line-height:1.7;
}

#reader{
  width:100%;
  margin-bottom:10px;
}

.status{
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  background:#f5f6f8;
  font-size:13px;
}

@media(max-width:500px){
  .row{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
<h1>📦 扫码入库</h1>
<p>云端库存管理系统</p >
</header>

<main>

<div class="card">

<h2>快速入库</h2>

<div id="reader"></div>

<button class="primary" id="scan" style="width:100%">
📷 扫码
</button>

<label>SKU / 条码</label>
<input id="sku" placeholder="扫描后自动填写">

<label>商品名称</label>
<input id="name" placeholder="例如:SQ40">

<div class="row">

<div>
<label>数量</label>
<input id="qty" type="number" value="1" min="1">
</div>
<div>
<label>进货单价</label>
<input id="unit_cost" type="number" step="0.01" placeholder="例如：80">
</div>

<div>
<label>礼品卡汇率（可选）</label>
<input id="gift_card_rate" type="number" step="0.0001" placeholder="不使用可留空">
</div>
<div>
<label>仓位</label>
<input id="location" placeholder="A01">
</div>

</div>

<label>备注</label>
<textarea id="note" placeholder="颜色、型号等"></textarea>

<button class="primary" id="add" style="width:100%;margin-top:12px">
＋ 确认入库
</button>

<div id="status" class="status">
正在连接云端数据库……
</div>

</div>


<div class="card">

<h2>库存概览</h2>

<div class="stats">

<div class="stat">
<b id="types">0</b>
<span>商品种类</span>
</div>

<div class="stat">
<b id="total">0</b>
<span>库存数量</span>
</div>

<div class="stat">
<b id="records">0</b>
<span>商品记录</span>
</div>

</div>

</div>


<div class="card">

<h2>库存</h2>

<input id="search" placeholder="搜索商品或 SKU">

<div id="list"></div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/html5-qrcode"></script>


<script>

/* =================================
   Supabase 配置
   ================================= */

const SUPABASE_URL =
"https://nqtevviqbamkugypaxvm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YMqSkCakd4SFe99USOfXEg_6QcjjMB9";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =================================
   页面元素
   ================================= */

const $ = id =>
document.getElementById(id);


/* =================================
   状态
   ================================= */

function setStatus(message){

  $("status").textContent = message;

}


/* =================================
   读取库存
   ================================= */

async function loadInventory(){

  setStatus("正在读取云端库存……");

  const {
    data,
    error
  } = await supabaseClient
    .from("products")
    .select("*")
    .order("created_at", {
      ascending:false
    });


  if(error){

    console.error(error);

    setStatus(
      "读取失败：" + error.message
    );

    return [];

  }


  return data || [];

}


/* =================================
   显示库存
   ================================= */

async function render(){

  const data =
    await loadInventory();
const { data: batches, error: batchError } =
  await supabaseClient
    .from("inventory_batches")
    .select("*")
    .order("created_at", { ascending: false });

if(batchError){
  console.error(batchError);
}

  let map = {};


  data.forEach(item => {

    const key =
      item.sku ||
      item.name ||
      item.id;


    if(!map[key]){

      map[key] = {

        sku:item.sku || "",

        name:item.name || "",

        location:item.location || "",

        quantity:0

      };

    }


    map[key].quantity +=
      Number(item.quantity || 0);

  });

const batchMap = {};

(batches || []).forEach(batch => {

  if(!batchMap[batch.sku]){
    batchMap[batch.sku] = [];
  }

  batchMap[batch.sku].push(batch);

});
  const search =
    $("search").value
      .trim()
      .toLowerCase();


  const items =
    Object.values(map).filter(item => {

      return (

        `${item.sku}
         ${item.name}
         ${item.location}`

      )
      .toLowerCase()
      .includes(search);

    });


  $("types").textContent =
    Object.keys(map).length;


  $("total").textContent =
    data.reduce(
      (sum,item) =>
        sum + Number(item.quantity || 0),
      0
    );


  $("records").textContent =
    data.length;


  if(items.length === 0){

    $("list").innerHTML =
      "<p style='text-align:center;color:#888'>暂无库存</p >";

    return;

  }


  

$("#list").innerHTML =
  items.map(item => {

    const itemBatches = (batches || []).filter(batch =>
      String(batch.sku || "") === String(item.sku || "")
    );

    return `
      <div class="item">

        <div class="name">
          ${escapeHtml(
            item.name || "未命名商品"
          )}
        </div>

        <div class="meta">

          SKU：
          ${escapeHtml(
            item.sku || "—"
          )}

          <br>

          仓位：
          ${escapeHtml(
            item.location || "—"
          )}

          <br><br>

          库存：
          <button onclick="changeStock('${item.sku}', -1)">−</button>
          <b>${item.quantity}</b>
          <button onclick="changeStock('${item.sku}', 1)">+</button>

        </div>

        <button
          style="margin-top:12px;width:100%;"
          onclick="toggleBatches('${item.sku}')"
        >
          查看进货批次
        </button>

        <div
          id="batches-${item.sku}"
          style="display:none;margin-top:12px;"
        >

          ${
            itemBatches.length === 0
              ? "<div>暂无进货记录</div>"
              : itemBatches.map(batch => `
                
                <div style="
                  padding:12px;
                  margin-top:8px;
                  background:#f5f6f8;
                  border-radius:10px;
                ">

                  <div>
                    <b>入库日期：</b>
                    ${new Date(batch.created_at).toLocaleString("zh-CN")}
                  </div>

                  <div>
                    <b>数量：</b>
                    ${Number(batch.quantity || 0)}
                  </div>

                  <div>
                    <b>进货价：</b>
                    $${Number(batch.unit_cost || 0).toFixed(2)}
                  </div>

                  <div>
                    <b>礼品卡汇率：</b>
                    ${Number(batch.gift_card_rate || 0)}
                  </div>

                </div>

              `).join("")
          }

        </div>

      </div>
    `;

  }).join("");
}

function toggleBatches(sku){

  const id = "batches-" + sku;

  const box = document.getElementById(id);

  if(!box) return;

  if(box.style.display === "none"){
    box.style.display = "block";
  }else{
    box.style.display = "none";
  }

}
/* =================================
   防止特殊字符
   ================================= */

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =================================
   输入 SKU 后查询商品
   ================================= */

let searchTimer = null;


$("sku").addEventListener(
  "input",
  function(){

    clearTimeout(searchTimer);


    searchTimer =
      setTimeout(
        findProduct,
        400
      );

  }
);


async function findProduct(){

  const sku =
    $("sku").value.trim();


  if(!sku){

    return;

  }


  setStatus(
    "正在查询商品……"
  );


  const {
    data,
    error
  } = await supabaseClient

    .from("products")

    .select("*")

    .eq("sku",sku)

    .order("created_at",{
      ascending:false
    })

    .limit(1);


  if(error){

    console.error(error);

    setStatus(
      "查询失败：" +
      error.message
    );

    return;

  }


  if(data && data.length > 0){

    const product =
      data[0];


    $("name").value =
      product.name || "";


    $("location").value =
      product.location || "";


    setStatus(
      "找到商品：" +
      (product.name || "未命名商品") +
      "｜当前库存：" +
      (product.quantity || 0)
    );

  }else{

    setStatus(
      "没有找到这个 SKU，可以创建新商品"
    );

  }

}


/* =================================
   确认入库
   ================================= */

$("add").onclick =
async function(){

  const sku =
    $("sku").value.trim();


  const name =
    $("name").value.trim();


  const quantity =
    Number($("qty").value);


  const location =
    $("location").value.trim();


  if(!sku){

    alert(
      "请输入 SKU 或扫描条码"
    );

    return;

  }


  if(!name){

    alert(
      "请输入商品名称"
    );

    return;

  }


  if(quantity < 1){

    alert(
      "数量必须大于 0"
    );

    return;

  }


  setStatus(
    "正在保存到云端……"
  );


  /* 查询是否已经存在 */

  const {
    data:existing,
    error:findError
  } = await supabaseClient

    .from("products")

    .select("*")

    .eq("sku",sku)

    .order("created_at",{
      ascending:false
    })

    .limit(1);


  if(findError){

    alert(
      "查询失败：" +
      findError.message
    );

    return;

  }


  /* 已经存在：增加库存 */

  if(existing && existing.length > 0){

    const product =
      existing[0];


    const newQuantity =
      Number(product.quantity || 0)
      + quantity;


    const {
      error:updateError
    } = await supabaseClient

      .from("products")

      .update({

        name:name,

        quantity:newQuantity,

        location:
          location ||
          product.location

      })

      .eq("id",product.id);


    if(updateError){

      alert(
        "更新库存失败：" +
        updateError.message
      );

      console.error(updateError);

      return;

    }


    alert(
      "入库成功！\n\n" +
      "当前库存：" +
      newQuantity
    );


  }else{

    /* 新商品 */

    const {
      error:insertError
    } = await supabaseClient

      .from("products")

      .insert({

        sku:sku,

        name:name,

        quantity:quantity,

        location:location || null

      });


    if(insertError){

      alert(
        "创建商品失败：" +
        insertError.message
      );

      console.error(insertError);

      return;

    }


    alert(
      "新商品入库成功！"
    );

  }

const unitCost = Number($("unit_cost").value || 0);
const giftCardRate = Number($("gift_card_rate").value || 0);

const { error: batchError } = await supabaseClient
  .from("inventory_batches")
  .insert({
    sku: sku,
    quantity: quantity,
    unit_cost: unitCost,
    gift_card_rate: giftCardRate,
    location: location || null
  });

if(batchError){
  alert("入库批次记录失败：" + batchError.message);
  console.error(batchError);
  return;
}
  $("sku").value = "";

  $("name").value = "";

  $("qty").value = 1;

  $("location").value = "";


  setStatus(
    "☁️ 入库完成，数据已经保存到云端"
  );


  render();

};


/* =================================
   搜索
   ================================= */

$("search").oninput =
function(){

  render();

};


/* =================================
   扫码
   ================================= */

let scanner = null;


$("scan").onclick =
async function(){

  if(scanner){

    return;

  }


  scanner =
    new Html5Qrcode("reader");


  try{

    await scanner.start(

      {
        facingMode:"environment"
      },

      {

        fps:10,

        qrbox:{
          width:250,
          height:150
        }

      },

      async code => {

        $("sku").value =
          code;


        await findProduct();


        await scanner.stop();


        scanner = null;

      }

    );


  }catch(error){

    console.error(error);


    alert(
      "无法打开摄像头，请允许浏览器使用摄像头。"
    );


    scanner = null;

  }

};


/* =================================
   启动
   ================================= */

async function changeStock(sku, delta) {
  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .eq("sku", sku)
    .limit(1);

  if (error || !data || data.length === 0) {
    alert("找不到这个商品");
    return;
  }

  const product = data[0];
  const oldQuantity = Number(product.quantity || 0);
  const newQuantity = oldQuantity + delta;

  if (newQuantity < 0) {
    alert("库存已经是 0，不能继续出库");
    return;
  }

  const { error: updateError } = await supabaseClient
    .from("products")
    .update({
      quantity: newQuantity
    })
    .eq("id", product.id);

  if (updateError) {
    alert("更新库存失败：" + updateError.message);
    return;
  }

  await render();
}
  render();

</script>

</body>
</html>
